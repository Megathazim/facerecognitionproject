<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduCheck AI - Scan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ffb59a",
                        "surface-container": "#edeeef",
                        "secondary-fixed": "#eaddff",
                        "secondary": "#7127e5",
                        "on-surface": "#191c1d",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#ffd4c5",
                        "on-background": "#191c1d",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed": "#380d00",
                        "surface-dim": "#d9dadb",
                        "surface-bright": "#f8f9fa",
                        "secondary-container": "#8b4aff",
                        "outline-variant": "#c3c5d7",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary-fixed": "#25005a",
                        "primary-fixed-dim": "#b5c4ff",
                        "tertiary-fixed": "#ffdbcf",
                        "on-error": "#ffffff",
                        "surface-tint": "#1353d8",
                        "surface-variant": "#e1e3e4",
                        "tertiary-container": "#ad3b00",
                        "on-primary-container": "#d4dcff",
                        "on-secondary-fixed-variant": "#5a00c6",
                        "surface-container-low": "#f3f4f5",
                        "background": "#f8f9fa",
                        "on-surface-variant": "#434654",
                        "on-primary-fixed": "#00174d",
                        "primary-container": "#1a56db",
                        "surface-container-highest": "#e1e3e4",
                        "inverse-primary": "#b5c4ff",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "outline": "#737686",
                        "primary": "#003fb1",
                        "on-primary-fixed-variant": "#003dab",
                        "surface-container-high": "#e7e8e9",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f0f1f2",
                        "surface": "#f8f9fa",
                        "tertiary": "#852b00",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#fffbff",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#802a00",
                        "inverse-surface": "#2e3132",
                        "secondary-fixed-dim": "#d2bbff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px",
                        "unit": "4px",
                        "max-width": "1200px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "stats-number": ["Hanken Grotesk"],
                        "label-md": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "stats-number": ["40px", { "lineHeight": "48px", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .scan-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 63, 177, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(0, 63, 177, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 63, 177, 0); }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar (Hidden on mobile as per logic, but included based on prompt) -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full z-50 bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline">
<div class="flex items-center gap-4">
<button class="hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 active:scale-95 duration-150 text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">EduCheck AI</h1>
</div>
<div>
<button class="hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors rounded-full p-1 active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="user_profile_photo">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-gutter pb-24 relative overflow-hidden">
<!-- Status Bar -->
<div class="absolute top-4 w-full px-gutter flex justify-between items-center z-10 max-w-md mx-auto left-0 right-0">
<div class="flex items-center gap-2 bg-surface-container-low px-4 py-2 rounded-full border border-outline-variant shadow-sm">
<span class="material-symbols-outlined text-primary animate-pulse" data-icon="settings_overscan" style="font-variation-settings: 'FILL' 0;">settings_overscan</span>
<span class="font-label-md text-label-md text-on-surface">Scanning...</span>
</div>
<button class="flex items-center gap-1 bg-surface-container-lowest border border-outline-variant px-3 py-2 rounded-lg text-primary hover:bg-surface-container-low transition-colors shadow-sm font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px]" data-icon="edit">edit</span>
                Manual Entry
            </button>
</div>
<!-- Scanner Area -->
<div class="relative flex flex-col items-center justify-center w-full max-w-md mt-12">
<!-- Camera Preview Container -->
<div class="relative w-64 h-64 md:w-80 md:h-80 rounded-full overflow-hidden border-4 border-surface-variant shadow-lg scan-pulse bg-surface-container-highest flex items-center justify-center">
<!-- Simulated Camera Feed (Placeholder Image) -->
<img alt="Camera Feed Background" class="absolute inset-0 w-full h-full object-cover opacity-50 blur-sm" data-alt="A brightly lit, neutral, blank office wall background with subtle soft lighting, intended as a placeholder for a camera feed. Corporate modern style, clean and uncluttered, light mode aesthetic, soft grays and whites." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDVXrhzJGmvL7TWbTEAQhX5oOOOqcaWmEvShlO2JZ1O3fspbDe0VkJYz05R4rdUxtlQpg6bI9pcVC4ABdeJ33s48TaqKtDbDO7ViuiMs7BIN2Fwx4kwkt4fBcb8oBizvjgnnUHNepaVlF_uJO4glP3eLgdXMag1eMyyFjbOwSu3qSLjoj7OX2gl0Xzgl4ymWdcBWolQVbfx9O1AeSdPDYkYMsDxMcPX88dVIDIYnKWFJeB9sOfXd4gz"/>
<!-- Scanning Grid Overlay -->
<div class="absolute inset-0 border-2 border-primary border-dashed rounded-full opacity-30 animate-[spin_10s_linear_infinite]"></div>
<!-- Focus Reticle -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-3/4 h-3/4 border-2 border-primary rounded-full relative opacity-50">
<!-- Crosshairs -->
<div class="absolute top-0 left-1/2 w-[2px] h-4 bg-primary -translate-x-1/2 -translate-y-full"></div>
<div class="absolute bottom-0 left-1/2 w-[2px] h-4 bg-primary -translate-x-1/2 translate-y-full"></div>
<div class="absolute left-0 top-1/2 h-[2px] w-4 bg-primary -translate-y-1/2 -translate-x-full"></div>
<div class="absolute right-0 top-1/2 h-[2px] w-4 bg-primary -translate-y-1/2 translate-x-full"></div>
</div>
</div>
<!-- Center Icon to indicate looking for face -->
<span class="material-symbols-outlined text-primary text-6xl opacity-20 relative z-10" data-icon="face">face</span>
</div>
<!-- Instructions -->
<div class="mt-8 text-center bg-surface-container-lowest p-4 rounded-xl shadow-sm border border-outline-variant w-full max-w-xs">
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Face Recognition</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Position your face within the frame to record attendance automatically.</p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface-container-lowest dark:bg-surface-dim border-t border-outline-variant dark:border-outline md:hidden">
<!-- Scan (Active) -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-4 py-1 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="face_recognition" style="font-variation-settings: 'FILL' 1;">drafts</span>
<span class="font-label-md text-label-md mt-1">Scan</span>
</a>
<!-- History -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-md text-label-md mt-1">History</span>
</a>
<!-- Classes -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-md text-label-md mt-1">Classes</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</a>
</nav>
</body></html>
